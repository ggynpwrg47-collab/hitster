# Alternative Projektbeschreibung für XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Nur nötig, falls SparListe.xcodeproj mit deiner Xcode-Version nicht öffnet:
#   brew install xcodegen && xcodegen generate
name: SparListe
options:
  bundleIdPrefix: de.privat
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  SparListeKit:
    path: SparListeKit
targets:
  SparListe:
    type: application
    platform: iOS
    sources:
      - SparListe
    dependencies:
      - package: SparListeKit
        product: SparListeCore
      - package: SparListeKit
        product: SparListeFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.privat.sparliste
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SparListe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  SparListe:
    build:
      targets:
        SparListe: all
    test:
      targets:
        - package: SparListeKit/SparListeCoreTests
        - package: SparListeKit/SparListeFeaturesTests
